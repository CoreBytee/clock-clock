name: Pages

on:
    push:
        branches: ["master"]
    pull_request:
        branches: ["master"]

    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2

            - run: bun install
            - run: bun run build

            - uses: actions/upload-pages-artifact@v3
              with:
                  path: "./dist/"

            - uses: actions/deploy-pages@v4
